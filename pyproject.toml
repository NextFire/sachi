[project]
name = "sachi"
dynamic = ["version"]
description = "Terminal media files renamer (FileBot alternative)"
readme = "README.md"
license = "MIT"
authors = [{ name = "NextFire", email = "git@yuru.moe" }]
requires-python = ">=3.12"
dependencies = [
    "aiohttp[speedups]==3.14.3",
    "backoff==2.2.1",
    "click==8.5.0",
    "guessit==4.4.0",
    "jinja2==3.1.6",
    "pydantic==2.13.5",
    "pymediainfo==7.0.1",
    "setuptools==84.0.0",        # guessit requirement
    "textual==8.2.8",
    "tomlkit==0.15.1",
    "typer==0.27.2",
    "yarl==1.24.5",
]

[dependency-groups]
dev = ["pyright==1.1.414", "ruff==0.16.6", "textual-dev==1.8.0"]

[project.scripts]
sachi = "sachi:cli_app"

[project.urls]
homepage = "https://github.com/NextFire/sachi"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.pyright]
pythonVersion = "3.12"

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["RUF012"]
